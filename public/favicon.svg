<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#071638" />
      <stop offset="100%" stopColor="#030817" />
    </linearGradient>
    <linearGradient id="fav-i" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00F5FF" />
      <stop offset="100%" stopColor="#386BFF" />
    </linearGradient>
    <linearGradient id="fav-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#386BFF" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>
    <radialGradient id="fav-globe" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#0A2A66" />
      <stop offset="60%" stopColor="#061A42" />
      <stop offset="100%" stopColor="#020818" />
    </radialGradient>
    <linearGradient id="fav-orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00F5FF" />
      <stop offset="50%" stopColor="#386BFF" />
      <stop offset="100%" stopColor="#C084FC" />
    </linearGradient>
    <clipPath id="fav-globe-clip">
      <circle cx="56" cy="51" r="14" />
    </clipPath>
  </defs>

  <!-- Dark Navy Rounded Icon Backdrop -->
  <rect width="100" height="100" rx="22" fill="url(#fav-bg)" />

  <!-- Rear Orbit Ring -->
  <g transform="rotate(-28, 56, 51)">
    <path d="M 18 51 A 38 14 0 0 1 94 51" stroke="url(#fav-orbit)" stroke-width="2.5" stroke-dasharray="1 3" opacity="0.75" />
  </g>

  <!-- I Pillar -->
  <rect x="14" y="23" width="13" height="54" rx="4" fill="url(#fav-i)" />
  <rect x="16" y="25" width="4" height="50" rx="1" fill="#FFFFFF" opacity="0.3" />

  <!-- A Diagonal Arms -->
  <path d="M 56 23 L 36 77 L 48 77 L 56 53 Z" fill="url(#fav-i)" />
  <path d="M 56 23 L 56 53 L 64 77 L 76 77 Z" fill="url(#fav-a)" />
  <circle cx="56" cy="24" r="3.5" fill="#00F5FF" />

  <!-- Central Globe -->
  <circle cx="56" cy="51" r="14" fill="url(#fav-globe)" stroke="#00F5FF" stroke-width="1.2" />
  <g clip-path="url(#fav-globe-clip)">
    <ellipse cx="56" cy="51" rx="14" ry="4.5" stroke="#00F5FF" stroke-width="1" fill="none" opacity="0.85" />
    <ellipse cx="56" cy="51" rx="5" ry="14" stroke="#386BFF" stroke-width="1" fill="none" opacity="0.85" />
    <circle cx="54" cy="49" r="6" fill="#00F5FF" opacity="0.4" />
    <circle cx="53" cy="48" r="2.5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Front Orbit Ring -->
  <g transform="rotate(-28, 56, 51)">
    <path d="M 94 51 A 38 14 0 0 1 18 51" stroke="url(#fav-orbit)" stroke-width="3.4" stroke-linecap="round" />
    <path d="M 88 51.5 A 35 12 0 0 1 24 51.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.7" />
    <circle cx="85" cy="51" r="3.2" fill="#FFFFFF" />
    <circle cx="85" cy="51" r="1.6" fill="#00F5FF" />
    <circle cx="28" cy="50.5" r="1.8" fill="#C084FC" />
  </g>
</svg>
